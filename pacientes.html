<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RetinaEdge - Pacientes</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>


    <header class="topo">

        <div class="logo">
            Retina<span>Edge</span>
        </div>

        <div class="usuario">
            Sistema de Triagem
        </div>

    </header>


    <div class="layout">


        <aside class="menu">

            <h2>Menu</h2>

            <a href="index.html">Dashboard</a>

            <a href="pacientes.html">Pacientes</a>

            <a href="exame.html">Novo Exame</a>

            <a href="historico.html">Histórico</a>

        </aside>


        <main class="conteudo">


            <h1>Cadastro de Paciente</h1>

            <p class="descricao">
                Cadastre um novo paciente para realizar a triagem.
            </p>


            <section class="painel">


                <form id="formPaciente">


                    <label for="nome">
                        Nome completo
                    </label>

                    <input
                        type="text"
                        id="nome"
                        required
                    >


                    <label for="dataNascimento">
                        Data de nascimento
                    </label>

                    <input
                        type="date"
                        id="dataNascimento"
                        required
                    >
                    <label for="CPF">
                        Documento de Identificação (CPF)
                    </label>

                    <input
                        type="text"
                        id="CPF"
                        inputmode="numeric"
                        maxlength="11"
                        pattern="[0-9]{11}"
                        placeholder="Somente numeros"
                        required
                    >

                    <label for="sexo">
                        Sexo
                    </label>

                    <select id="sexo" required>

                        <option value="">
                            Selecione
                        </option>

                        <option value="Masculino">
                            Masculino
                        </option>

                        <option value="Feminino">
                            Feminino
                        </option>

                    </select>


                    <label for="diabetes">
                        Possui diabetes?
                    </label>

                    <select id="diabetes" required>

                        <option value="">
                            Selecione
                        </option>

                        <option value="Sim">
                            Sim
                        </option>

                        <option value="Não">
                            Não
                        </option>

                    </select>


                    <br>


                    <button type="submit">
                        Cadastrar paciente
                    </button>


                </form>


                <p id="mensagem"></p>


            </section>


        </main>


    </div>


    <script src="js/app.js"></script>

</body>

</html>
